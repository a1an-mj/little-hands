# Builds and tests the Windows installer on a real Windows machine (the developer has none).
# Runs when a version tag is pushed (git tag v1.0.0 && git push origin v1.0.0), or by hand from the
# Actions tab ("Run workflow"). The installer is attached to the run under "Artifacts".
name: Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (fees, balances, attendance, backups)
        run: npm test

      - name: Build
        run: npm run build

      - name: End-to-end tests in Electron, on Windows
        run: npx playwright test

      - name: Make the installer
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: Little-Hands-Setup
          path: dist/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
